<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" font-family="Noto Sans CJK KR" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1B2430"/></marker></defs><rect width="760" height="620" fill="#FFFFFF"/><rect x="8" y="20" width="124" height="42" rx="6" fill="#DCE8F5" stroke="#2F6FB2"/><text x="70.0" y="37.35" text-anchor="middle" font-size="11" font-weight="700" fill="#1B2430">사용자 화면</text><text x="70.0" y="52.35" text-anchor="middle" font-size="10" fill="#6B7280">Swagger / React</text><rect x="168" y="20" width="124" height="42" rx="6" fill="#DCE8F5" stroke="#2F6FB2"/><text x="230.0" y="37.35" text-anchor="middle" font-size="11" font-weight="700" fill="#1B2430">pain_logs.py</text><text x="230.0" y="52.35" text-anchor="middle" font-size="10" fill="#6B7280">API 라우터</text><rect x="318" y="20" width="124" height="42" rx="6" fill="#DCE8F5" stroke="#2F6FB2"/><text x="380.0" y="37.35" text-anchor="middle" font-size="11" font-weight="700" fill="#1B2430">schemas · deps</text><text x="380.0" y="52.35" text-anchor="middle" font-size="10" fill="#6B7280">검사 · 사용자</text><rect x="468" y="20" width="124" height="42" rx="6" fill="#DCE8F5" stroke="#2F6FB2"/><text x="530.0" y="37.35" text-anchor="middle" font-size="11" font-weight="700" fill="#1B2430">rule_engine.py</text><text x="530.0" y="52.35" text-anchor="middle" font-size="10" fill="#6B7280">규칙 판정</text><rect x="618" y="20" width="124" height="42" rx="6" fill="#FFF6E8" stroke="#B5621A"/><text x="680.0" y="37.35" text-anchor="middle" font-size="11" font-weight="700" fill="#1B2430">MySQL</text><text x="680.0" y="52.35" text-anchor="middle" font-size="10" fill="#6B7280">DB</text><line x1="70" y1="62" x2="70" y2="610" stroke="#9AA3AE" stroke-dasharray="4 4"/><line x1="230" y1="62" x2="230" y2="610" stroke="#9AA3AE" stroke-dasharray="4 4"/><line x1="380" y1="62" x2="380" y2="610" stroke="#9AA3AE" stroke-dasharray="4 4"/><line x1="530" y1="62" x2="530" y2="610" stroke="#9AA3AE" stroke-dasharray="4 4"/><line x1="680" y1="62" x2="680" y2="610" stroke="#9AA3AE" stroke-dasharray="4 4"/><rect x="225" y="80" width="10" height="510" fill="#FFFFFF" stroke="#2F6FB2"/><line x1="70" y1="90" x2="230" y2="90" stroke="#1B2430" stroke-width="1.3" marker-end="url(#a)"/><text x="78" y="85" text-anchor="start" font-size="11" fill="#1B2430">1. POST /api/pain-logs</text><line x1="235" y1="120" x2="380" y2="120" stroke="#1B2430" stroke-width="1.3" marker-end="url(#a)"/><text x="238" y="115" text-anchor="start" font-size="11" fill="#1B2430">2. 입력 검사 (점수 0~10 등, 아니면 422)</text><line x1="235" y1="150" x2="380" y2="150" stroke="#1B2430" stroke-width="1.3" marker-end="url(#a)"/><text x="238" y="145" text-anchor="start" font-size="11" fill="#1B2430">3. get_current_user() → user_id</text><line x1="235" y1="180" x2="680" y2="180" stroke="#1B2430" stroke-width="1.3" marker-end="url(#a)"/><text x="238" y="175" text-anchor="start" font-size="11" fill="#1B2430">4. BEGIN · 사용자·위치·유형 있는지 SELECT</text><line x1="235" y1="210" x2="680" y2="210" stroke="#1B2430" stroke-width="1.3" marker-end="url(#a)"/><text x="238" y="205" text-anchor="start" font-size="11" fill="#1B2430">5. INSERT pain_logs (recorded_at = UTC)</text><line x1="680" y1="240" x2="235" y2="240" stroke="#1B2430" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#o)"/><text x="455.0" y="235" text-anchor="middle" font-size="11" fill="#1B2430">log_id</text><line x1="235" y1="270" x2="530" y2="270" stroke="#1B2430" stroke-width="1.3" marker-end="url(#a)"/><text x="238" y="265" text-anchor="start" font-size="11" fill="#1B2430">6. collect_context(user_id)</text><line x1="530" y1="300" x2="680" y2="300" stroke="#1B2430" stroke-width="1.3" marker-end="url(#a)"/><text x="538" y="295" text-anchor="start" font-size="11" fill="#1B2430">질환·증상·활동·체크인 SELECT</text><line x1="235" y1="330" x2="530" y2="330" stroke="#1B2430" stroke-width="1.3" marker-end="url(#a)"/><text x="238" y="325" text-anchor="start" font-size="11" fill="#1B2430">7. match_rules(점수, 상태)</text><line x1="530" y1="360" x2="680" y2="360" stroke="#1B2430" stroke-width="1.3" marker-end="url(#a)"/><text x="538" y="355" text-anchor="start" font-size="11" fill="#1B2430">규칙 SELECT → 조건 검사</text><line x1="235" y1="390" x2="530" y2="390" stroke="#1B2430" stroke-width="1.3" marker-end="url(#a)"/><text x="238" y="385" text-anchor="start" font-size="11" fill="#1B2430">8. decide() 운동마다 하나 (금기&gt;주의&gt;추천)</text><line x1="235" y1="420" x2="530" y2="420" stroke="#1B2430" stroke-width="1.3" marker-end="url(#a)"/><text x="238" y="415" text-anchor="start" font-size="11" fill="#1B2430">9. save_guides()</text><line x1="530" y1="450" x2="680" y2="450" stroke="#1B2430" stroke-width="1.3" marker-end="url(#a)"/><text x="538" y="445" text-anchor="start" font-size="11" fill="#1B2430">INSERT pain_log_guide</text><line x1="235" y1="480" x2="680" y2="480" stroke="#1B2430" stroke-width="1.3" marker-end="url(#a)"/><text x="238" y="475" text-anchor="start" font-size="11" fill="#1B2430">10. UPDATE 판정 상태 · 빠진 자료</text><line x1="235" y1="510" x2="680" y2="510" stroke="#1B2430" stroke-width="1.3" marker-end="url(#a)"/><text x="238" y="505" text-anchor="start" font-size="11" fill="#1B2430">11. load_detail(): 저장된 값 다시 SELECT</text><line x1="235" y1="540" x2="680" y2="540" stroke="#1B2430" stroke-width="1.3" marker-end="url(#a)"/><text x="238" y="535" text-anchor="start" font-size="11" fill="#1B2430">12. COMMIT (중간 실패 시 전부 취소)</text><line x1="225" y1="570" x2="70" y2="570" stroke="#1B2430" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#o)"/><text x="150.0" y="565" text-anchor="middle" font-size="11" fill="#1B2430">13. 201 + 결과</text></svg>